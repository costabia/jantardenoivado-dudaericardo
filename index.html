<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#60010C" />
    <title>Save the date · Maria Eduarda &amp; Ricardo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="invitation" id="invitation" aria-label="Save the date de Maria Eduarda e Ricardo">
      <section class="cover" id="cover" aria-label="Capa do convite">
        <div class="cover__glow" aria-hidden="true"></div>
        <p class="eyebrow">save the date</p>
        <h1 class="names names--cover">Maria Eduarda <span>&amp;</span> Ricardo</h1>
        <div class="machine" aria-hidden="true">
            <img class="frame-animation" src="assets/frame-animation.svg" alt="" loading="eager" fetchpriority="high" />
        </div>
        <button class="open-button" id="openButton" type="button" aria-label="Clique para abrir convite">clique para abrir convite</button>
      </section>
      <section class="details" id="details" aria-label="Detalhes do jantar de noivado">
        <div class="paperwork">
          <article class="save-card">
            <p class="save-card__tiny">JANTAR DE NOIVADO</p>
            <img src="assets/couple-photo.png" alt="Maria Eduarda e Ricardo" />
            <div class="save-card__title"><span>SAVE</span> <small>THE</small> <span>DATE</span></div>
            <p class="save-card__names">MARIA EDUARDA &amp; RICARDO</p>
          </article>
          <article class="letter-card">
            <p class="letter-card__cinzel">convidamos vocês para nosso</p>
            <p class="letter-card__script">Jantar de Noivado</p>
            <p class="letter-card__date">03 de outubro de 2026 às 20h<small>blumenau-sc</small></p>
          </article>
          <img class="detail-strip" src="assets/photobooth.png" alt="Fotos de Maria Eduarda e Ricardo" />
          
          <img class="envelope" src="assets/envelope.png" alt="Envelope do convite" />
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
